name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug)
        run: |
          xcodebuild -project Ares.xcodeproj \
            -scheme Ares \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run XCTest
        run: |
          xcodebuild -project Ares.xcodeproj \
            -scheme Ares \
            -configuration Debug \
            -destination 'platform=macOS' \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
