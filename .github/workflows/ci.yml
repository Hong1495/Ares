name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode
        run: scripts/select-xcode.sh
      - name: Build without launching Ares
        run: xcodebuild -project Ares.xcodeproj -scheme Ares -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Isolated tests
        run: |
          scripts/test-safe-functions.sh
          scripts/test-proxy-controller.sh
          scripts/test-core-process-reaper.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build isolated preview
        run: |
          scripts/preview-ui.sh
          scripts/preview-subscription.sh
