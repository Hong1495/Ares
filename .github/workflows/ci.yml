name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug)
        run: |
          xcodebuild -project Ares.xcodeproj \
            -scheme Ares \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run XCTest
        run: |
          xcodebuild -project Ares.xcodeproj \
            -scheme Ares \
            -configuration Debug \
            -destination 'platform=macOS' \
            test \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Build Ares (${{ matrix.arch }})
        run: |
          xcodebuild -project Ares.xcodeproj \
            -scheme Ares \
            -configuration Release \
            -derivedDataPath .build/DerivedData/${{ matrix.arch }} \
            ARCHS=${{ matrix.arch }} \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Download mihomo (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH_NAME="${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}"
          ASSET=$(gh api repos/MetaCubeX/mihomo/releases/latest \
            --jq '.assets[].name' | grep "darwin-${ARCH_NAME}" | grep -v '\-go' | head -1)
          TAG=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ASSET}" \
            | gunzip > /tmp/mihomo
          chmod +x /tmp/mihomo

      - name: Package DMG
        run: |
          PRODUCT_DIR=".build/DerivedData/${{ matrix.arch }}/Build/Products/Release"
          STAGING="/tmp/Ares-${{ matrix.arch }}"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$PRODUCT_DIR/Ares.app" "$STAGING/"
          cp /tmp/mihomo "$STAGING/Ares.app/Contents/Resources/clash-meta"
          chmod +x "$STAGING/Ares.app/Contents/Resources/clash-meta"
          ln -s /Applications "$STAGING/Applications"

          DMG="Ares-${{ github.ref_name }}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Ares" \
            -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"
          rm -rf "$STAGING"

          echo "dmg_path=$DMG" >> $GITHUB_ENV

      - name: Upload DMG to Release
        run: |
          gh release upload ${{ github.ref_name }} \
            "$DMG" --clobber \
            --repo ${{ github.repository }}