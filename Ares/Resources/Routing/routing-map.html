<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src blob:; child-src blob:"><style>html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f7fa}canvas{position:absolute;left:0;top:0}.maplibregl-canvas-container{width:100%;height:100%}.maplibregl-canvas{outline:none}.maplibregl-control-container{display:none}</style></head><body><div id="map"></div><script>__RENDERER__</script><script>
const world=__WORLD__;
let snapshot={routes:[]},selected=null,dark=false,ready=false,geometryKey='',pendingCommand='world';
function notify(name,value){window.webkit?.messageHandlers?.[name]?.postMessage(value)}
window.onerror=(message)=>notify('status','Map error: '+message);
const map=new maplibregl.Map({container:'map',attributionControl:false,minZoom:-2,maxZoom:7,renderWorldCopies:true,transformConstrain:(center,zoom)=>({center,zoom}),dragRotate:false,pitchWithRotate:false,touchPitch:false,style:{version:8,sources:{world:{type:'geojson',data:world}},layers:[{id:'background',type:'background',paint:{'background-color':'#f6f7fa'}},{id:'land',type:'fill',source:'world',paint:{'fill-color':'#e2e6ec'}},{id:'borders',type:'line',source:'world',paint:{'line-color':'#c7cfd9','line-width':.5}}]},center:[0,0],zoom:0});
__GEOMETRY__
let geometry = RoutingGeometry.features([]);
function paint(){const bg=dark?'#171c25':'#f6f7fa';document.body.style.background=bg;document.getElementById('map').style.background=bg;if(!ready)return;map.setPaintProperty('background','background-color',bg);map.setPaintProperty('land','fill-color',dark?'#283341':'#e2e6ec');map.setPaintProperty('borders','line-color',dark?'#405063':'#c7cfd9');const keys=[...geometry.memberships].filter(([key,ids])=>ids.includes(selected)).map(([key])=>key);const match=['in',['get','key'],['literal',keys]];for(const layer of ['routes','points']){const prefix=layer==='routes'?'line':'circle';map.setPaintProperty(layer,prefix+'-color',['case',match,'#e9a64b',dark?'#83b3ea':'#437eb9']);map.setPaintProperty(layer,prefix+'-opacity',selected?['case',match,1,.16]:.65)}}
function updateGeometry(){if(!ready)return;const key=JSON.stringify(snapshot.routes.map(r=>[r.id,r.endpoints.map(e=>e.location)]));if(key!==geometryKey){geometryKey=key;geometry=RoutingGeometry.features(snapshot.routes);map.getSource('routes').setData(geometry.lines);map.getSource('points').setData(geometry.points)}paint()}
window.setSnapshot=value=>{snapshot=value;updateGeometry()};
window.setAppearance=value=>{dark=value;paint()};
window.selectRoute=value=>{selected=value;paint()};
window.mapCommand=kind=>{pendingCommand=kind;if(!ready)return;if(kind==='in'){map.zoomIn({duration:0});return}if(kind==='out'){map.zoomOut({duration:0});return}if(kind==='world'){map.setRenderWorldCopies(false);map.fitBounds([[-180,-85],[180,85]],{padding:32,duration:0});return}map.setRenderWorldCopies(true);const data=kind==='selection'?RoutingGeometry.features(snapshot.routes.filter(r=>r.id===selected)):geometry;const pts=data.points.features.map(f=>f.geometry.coordinates);for(const line of data.lines.features)for(const segment of line.geometry.coordinates)for(const point of segment)pts.push(point);if(pts.length){map.fitBounds(RoutingGeometry.bounds(pts),{padding:50,duration:0,maxZoom:4})}};
new ResizeObserver(()=>map.resize()).observe(document.getElementById('map'));
map.on('load',()=>{map.addSource('routes',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'routes',type:'line',source:'routes',paint:{'line-color':'#437eb9','line-width':1.5,'line-dasharray':[3,2]}});map.addSource('points',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'points',type:'circle',source:'points',paint:{'circle-color':'#437eb9','circle-radius':4,'circle-stroke-width':1,'circle-stroke-color':'#cbd8e8'}});ready=true;updateGeometry();window.mapCommand(pendingCommand);notify('status','ready')});
map.on('click',event=>{const hits=map.queryRenderedFeatures([[event.point.x-5,event.point.y-5],[event.point.x+5,event.point.y+5]],{layers:['points','routes']});if(hits.length){const members=geometry.memberships.get(hits[0].properties.key)||[];if(members.length)notify('selection',members[(members.indexOf(selected)+1)%members.length])}});
map.on('error',event=>notify('status','Map renderer unavailable: '+event.error.message));
</script></body></html>
