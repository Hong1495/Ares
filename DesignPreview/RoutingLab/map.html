<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="maplibre-gl.css" rel="stylesheet"><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fa}.maplibregl-ctrl-attrib{font:10px -apple-system;color:#7d8390;background:transparent}#message{position:absolute;bottom:12px;left:12px;font:11px -apple-system;color:#667080;pointer-events:none}</style></head><body><div id="map"></div><div id="message">Starting renderer…</div><script src="maplibre-gl.js"></script><script>
const world=__WORLD__, fixtures=__FIXTURES__;
let scenario=0,dark=false,selected=null,start=performance.now();
const map=new maplibregl.Map({container:'map',attributionControl:false,minZoom:-2,maxZoom:8,transformConstrain:(center,zoom)=>({center,zoom}),renderWorldCopies:true,style:{version:8,sources:{world:{type:'geojson',data:world}},layers:[{id:'background',type:'background',paint:{'background-color':'#f6f7fa'}},{id:'land',type:'fill',source:'world',paint:{'fill-color':'#e2e6ec'}},{id:'borders',type:'line',source:'world',paint:{'line-color':'#c7cfd9','line-width':0.5}}]},center:[0,15],zoom:0});
map.addControl(new maplibregl.AttributionControl({customAttribution:'Natural Earth · Public domain · Simulated routes',compact:false}));
function tell(text){document.getElementById('message').textContent=text;window.webkit?.messageHandlers?.metrics?.postMessage(text)}
function emitSelection(id){window.webkit?.messageHandlers?.selection?.postMessage(id)}
function featureData(){return {type:'FeatureCollection',features:fixtures[scenario].edges.map(e=>({type:'Feature',id:e.id,properties:{id:e.id,count:e.count},geometry:{type:'LineString',coordinates:e.points}}))}}
function nodes(){const points=new Map;for(const e of fixtures[scenario].edges){for(const p of [e.from,e.to]){const k=p.join(',');points.set(k,p)}}return {type:'FeatureCollection',features:[...points.values()].map(p=>({type:'Feature',properties:{},geometry:{type:'Point',coordinates:p}}))}}
function bounds(points){const xs=points.map(p=>(p[0]%360+360)%360).sort((a,b)=>a-b);let gap=-1,index=0;for(let i=0;i<xs.length;i++){let g=(i===xs.length-1?xs[0]+360:xs[i+1])-xs[i];if(g>gap){gap=g;index=i}}const left=xs[(index+1)%xs.length];const unwrapped=points.map(p=>[(p[0]%360+360)%360<left?(p[0]%360+360)%360+360:(p[0]%360+360)%360,p[1]]);return [[Math.min(...unwrapped.map(p=>p[0])),Math.min(...points.map(p=>p[1]))],[Math.max(...unwrapped.map(p=>p[0])),Math.max(...points.map(p=>p[1]))]]}
function fit(mode){if(!map.getSource('routes'))return;if(mode==='world'){map.setRenderWorldCopies(false);map.fitBounds([[-180,-85],[180,85]],{padding:32,duration:0});return}map.setRenderWorldCopies(true);const edges=selected&&mode==='selection'?fixtures[scenario].edges.filter(e=>e.id===selected):fixtures[scenario].edges;const pts=edges.flatMap(e=>e.points);if(pts.length)map.fitBounds(bounds(pts),{padding:60,duration:0,maxZoom:5});}
function paint(){document.body.style.background=dark?'#171c25':'#f6f7fa';document.getElementById('map').style.background=dark?'#171c25':'#f6f7fa';document.getElementById('message').style.color=dark?'#a3afbf':'#667080';map.setPaintProperty('background','background-color',dark?'#171c25':'#f6f7fa');map.setPaintProperty('land','fill-color',dark?'#283341':'#e2e6ec');map.setPaintProperty('borders','line-color',dark?'#405063':'#c7cfd9');map.setPaintProperty('routes','line-color',['case',['==',['get','id'],selected||''],'#e9a64b',dark?'#78a9e5':'#437eb9']);map.setPaintProperty('routes','line-opacity',selected?['case',['==',['get','id'],selected],1,.12]:.42);map.setPaintProperty('routes','line-width',['case',['==',['get','id'],selected||''],3,1.3]);}
window.update=(index,isDark,id)=>{scenario=index;dark=isDark;selected=id; if(!map.getSource('routes'))return;const began=performance.now();map.getSource('routes').setData(featureData());map.getSource('nodes').setData(nodes());paint();map.once('idle',()=>tell(`MapLibre · update to idle ${(performance.now()-began).toFixed(1)} ms · ${fixtures[scenario].edges.length} aggregate routes`));};
window.command=kind=>{if(kind==='in')map.zoomIn({duration:0});else if(kind==='out')map.zoomOut({duration:0});else fit(kind)};
map.on('load',()=>{map.addSource('routes',{type:'geojson',data:featureData()});map.addLayer({id:'routes',type:'line',source:'routes',paint:{'line-color':'#437eb9','line-width':1.3,'line-opacity':.42}});map.addSource('nodes',{type:'geojson',data:nodes()});map.addLayer({id:'nodes',type:'circle',source:'nodes',paint:{'circle-radius':3,'circle-color':'#4587c9','circle-stroke-width':1,'circle-stroke-color':'#f6f7fa'}});paint();fit('world');map.once('idle',()=>tell(`MapLibre · first idle ${(performance.now()-start).toFixed(1)} ms`));});
map.on('click','routes',event=>{if(event.features?.length)emitSelection(event.features[0].properties.id)});
map.on('error',e=>tell('Renderer error: '+e.error.message));
</script></body></html>
